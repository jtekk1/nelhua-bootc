---
name: Build container image
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '05 10 * * *'   # :latest catch-up; main pushes already cover it
  push:
    branches: [main]
    tags: ['v*']            # tag push -> :stable + :v<tag> immutable pin
    paths-ignore:
      - '**/README.md'
      - 'archive/**'
      - 'plan.md'
  workflow_dispatch:         # manual -> :stable

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: ${{ matrix.desktop.name }} / ${{ matrix.channel.name }}
    runs-on: ubuntu-24.04
    # Rawhide is best-effort — F45 / kinoite:rawhide may lack repo parity.
    # Don't fail the workflow when rawhide cells break; stable cells are binding.
    continue-on-error: ${{ matrix.channel.name == 'rawhide' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # Active flavors. mango was CI-paused for ~3 weeks after Terra F44
        # bumped scenefx 0.4 -> 0.5 without rebuilding mangowm against the
        # new soname. TekkRPMs/scenefx0.4 now backfills the 0.4 slot in the
        # tekk-fedora-44 repo (parallel-installable with Terra's scenefx-0.5),
        # so mangowm-0.14.4's `Requires: libscenefx-0.4.so()(64bit)`
        # resolves again and mango is back in the matrix.
        desktop:
          - name: mango
            base_repo: "quay.io/fedora/fedora-bootc"
            image: nelhua-mango
            containerfile: ./Containerfile
            description: "Nelhua Linux bootc (Mango Wayland compositor)"
            keywords: "bootc,fedora,wayland,mango,mangowm,nelhua"
          - name: kde
            base_repo: "quay.io/fedora/fedora-kinoite"
            image: nelhua-kde
            containerfile: ./Containerfile
            description: "Nelhua Linux bootc (KDE edition)"
            keywords: "bootc,fedora,kde,plasma,kinoite,nelhua"
          - name: kinectic
            base_repo: "quay.io/fedora/fedora-kinoite"
            image: nelhua-kinectic
            containerfile: ./Containerfile
            description: "Nelhua Linux bootc (KineticWE edition — tiling KWin fork)"
            keywords: "bootc,fedora,kde,plasma,kinoite,kineticwe,tiling,nelhua"
          - name: kde-nvidia-open
            base_repo: "quay.io/fedora/fedora-kinoite"
            image: nelhua-kde-nvidia-open
            # kde-nvidia-open uses a separate Containerfile with two extra
            # FROM stages for ublue's akmods + akmods-nvidia-open images.
            # Tag pins for both stages live in Containerfile.nvidia-open;
            # Renovate keeps them bumped in step with the base kernel.
            containerfile: ./Containerfile.nvidia-open
            description: "Nelhua Linux bootc (KDE Plasma 6 + NVIDIA open kernel modules — Turing+ / RTX 20-series and newer)"
            keywords: "bootc,fedora,kde,plasma,kinoite,nvidia,nvidia-open,nelhua"
        # Rawhide channel is disabled until we fix apply_signing()'s
        # assumption that /etc/containers/policy.json exists on the base
        # image — F45 kinoite doesn't ship it, so every rawhide cell was
        # bailing with FileNotFoundError at apply_signing. See plan.md
        # "rawhide re-enable path". Re-add `- { name: rawhide, base_tag:
        # "rawhide" }` here once policy.json is seeded when missing.
        channel:
          - { name: stable, base_tag: "44" }

    steps:
      - name: Determine channel
        id: channel
        run: |
          # Stable channel follows the trigger-based mapping:
          #   - push to main         -> :latest
          #   - push of v* tag       -> :stable (+ :v<tag>, see metadata-action)
          #   - workflow_dispatch    -> :stable
          #   - schedule (cron)      -> :latest (catch-up)
          #   - pull_request         -> :pr-N
          # Rawhide channel always tags :rawhide regardless of trigger
          # (PRs use :rawhide-pr-N to avoid noise on shared logs).
          if [[ "${{ matrix.channel.name }}" == "rawhide" ]]; then
            case "${{ github.event_name }}" in
              pull_request) CHANNEL="rawhide-pr-${{ github.event.number }}" ;;
              *)            CHANNEL=rawhide ;;
            esac
          else
            case "${{ github.event_name }}" in
              schedule)          CHANNEL=latest ;;
              pull_request)      CHANNEL="pr-${{ github.event.number }}" ;;
              workflow_dispatch) CHANNEL=stable ;;
              push)
                if [[ "${{ github.ref_type }}" == "tag" ]]; then
                  CHANNEL=stable
                else
                  CHANNEL=latest
                fi
                ;;
              *)                 CHANNEL=latest ;;
            esac
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Prepare environment
        run: |
          REG_LC="${IMAGE_REGISTRY,,}"
          IMG_LC="${{ matrix.desktop.image }}"
          IMG_LC="${IMG_LC,,}"
          echo "IMAGE_REGISTRY=${REG_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMG_LC}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${{ matrix.desktop.base_repo }}:${{ matrix.channel.base_tag }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          tags: |
            type=raw,value=${{ steps.channel.outputs.channel }}
            type=raw,value=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            type=ref,event=tag,enable=${{ matrix.channel.name == 'stable' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.desktop.description }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.version=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.keywords=${{ matrix.desktop.keywords }}
            io.artifacthub.package.license=Apache-2.0
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          # Per-flavor Containerfile selection: kde/kinectic use ./Containerfile;
          # kde-nvidia-open uses ./Containerfile.nvidia-open (adds two akmods
          # FROM stages). Field is set on every matrix.desktop entry.
          containerfiles: ${{ matrix.desktop.containerfile }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_REGISTRY_PATH=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
            DESKTOP=${{ matrix.desktop.name }}

      - name: Pick first tag for chunkah input
        id: chunkah_tag
        run: |
          # buildah-build tags the image with every metadata tag (they're
          # aliases to one digest); chunkah only needs one of them as --from.
          FIRST_TAG=$(printf '%s\n' ${{ steps.metadata.outputs.tags }} | head -n1)
          echo "tag=${FIRST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Postprocess with chunkah
        # Repacks the single monolithic `RUN build.sh` layer into many
        # content-similarity layers, so an upgrade delta only fetches the
        # blobs that actually changed. Expected payback: 2 GB -> 150-400 MB
        # per `bootc upgrade`. Runs on PR builds too so chunkah breakage
        # surfaces at PR time, not on the first merged push.
        # renovate: datasource=docker depName=quay.io/coreos/chunkah
        env:
          CHUNKAH_IMAGE: "quay.io/coreos/chunkah:v0.6.0"
        run: |
          mkdir -p ./out
          SRC="localhost/${IMAGE_NAME}:${{ steps.chunkah_tag.outputs.tag }}"
          # SOURCE_DATE_EPOCH pinned to the commit timestamp so chunkah
          # produces the same manifest digest on identical input — needed
          # for cosign verification to stay deterministic.
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "${{ github.sha }}")
          # chunkah only sees the rootfs at /chunkah; it does NOT read the
          # source image's OCI config automatically. Without this the
          # output loses labels (org.opencontainers.image.*), env, cmd,
          # entrypoint, etc. Pass the buildah-built image's full inspect
          # blob via CHUNKAH_CONFIG_STR per the upstream README pattern.
          export CHUNKAH_CONFIG_STR
          CHUNKAH_CONFIG_STR="$(podman inspect "$SRC")"
          # --mount=type=image is podman's native way to surface another
          # image's rootfs inside a container. Requires the source image
          # in podman's local storage, which buildah-build provides since
          # buildah + rootless podman share ~/.local/share/containers.
          # NOTE: podman's --mount=type=image accepts `destination=` or
          # `dst=` for the mount point — NOT `dest=`. The chunkah README
          # uses `dest=` but newer podman (rootless on ubuntu-24.04) is
          # stricter. Keep this canonical or future podman bumps will
          # break the step the same way.
          # --prune /sysroot/ + --label ostree.{commit,final-diffid}-
          # convert an OSTree-derived base (our KDE build's fedora-kinoite)
          # into a "plain" bootc image. Without them bootc sees the OSTree
          # labels but chunkah-repacked layers don't carry the matching
          # per-layer ostree.final-diffid annotations, so it errors:
          #   "Missing ostree.final-diffid sha256:<layer-hash>"
          # No-op on the mango build (fedora-bootc:44 is non-OSTree since
          # Fedora 41), so apply universally rather than conditionally.
          podman run --rm --privileged \
            --mount="type=image,src=${SRC},destination=/chunkah" \
            -v "$PWD/out:/out" \
            -e SOURCE_DATE_EPOCH \
            -e CHUNKAH_CONFIG_STR \
            "${CHUNKAH_IMAGE}" build \
              --prune /sysroot/ \
              --max-layers 128 \
              --label ostree.commit- \
              --label ostree.final-diffid- \
              --output oci:/out/image
          # Sanity check: chunkah should have produced an OCI dir.
          test -f ./out/image/index.json

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chunkah output to ghcr.io
        # Replaces redhat-actions/push-to-registry — that action pushes
        # from containers-storage, but we want to push chunkah's oci:./out
        # output (the whole point of the postprocess step). skopeo's
        # --preserve-digests guarantees the on-registry manifest digest
        # matches what cosign will sign in the next step.
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            skopeo copy --preserve-digests \
              oci:./out/image \
              "docker://${IMAGE_FULL}:${tag}"
          done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}:${tag}"
          done
