---
name: Build container image
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '05 10 * * *'   # :latest catch-up; main pushes already cover it
  push:
    branches: [main]
    tags: ['v*']            # tag push -> :stable + :v<tag> immutable pin
    paths-ignore:
      - '**/README.md'
      - 'archive/**'
      - 'plan.md'
  workflow_dispatch:         # manual -> :stable

env:
  IMAGE_DESC: "Nelhua Linux bootc (Mango edition)"
  IMAGE_KEYWORDS: "bootc,fedora,mango,nelhua"
  IMAGE_NAME: "nelhua-mango"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Determine channel
        id: channel
        run: |
          # :latest tracks tip-of-main (every push to main + cron catch-up).
          # :stable is deliberate — workflow_dispatch or a v* git tag.
          # On a v* tag push we ALSO emit :v<tag> as an immutable pin (see
          # metadata-action `type=ref,event=tag` below).
          case "${{ github.event_name }}" in
            schedule)          CHANNEL=latest ;;
            pull_request)      CHANNEL="pr-${{ github.event.number }}" ;;
            workflow_dispatch) CHANNEL=stable ;;
            push)
              if [[ "${{ github.ref_type }}" == "tag" ]]; then
                CHANNEL=stable
              else
                CHANNEL=latest
              fi
              ;;
            *)                 CHANNEL=latest ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          tags: |
            type=raw,value=${{ steps.channel.outputs.channel }}
            type=raw,value=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            type=ref,event=tag
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.version=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}:${tag}"
          done
