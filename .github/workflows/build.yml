---
name: Build container image
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '05 10 * * *'   # :latest catch-up; main pushes already cover it
  push:
    branches: [main]
    tags: ['v*']            # tag push -> :stable + :v<tag> immutable pin
    paths-ignore:
      - '**/README.md'
      - 'archive/**'
      - 'plan.md'
  workflow_dispatch:         # manual -> :stable

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: ${{ matrix.desktop.name }} / ${{ matrix.channel.name }}
    runs-on: ubuntu-24.04
    # Rawhide is best-effort — F45 / kinoite:rawhide may lack repo parity.
    # Don't fail the workflow when rawhide cells break; stable cells are binding.
    continue-on-error: ${{ matrix.channel.name == 'rawhide' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        desktop:
          - name: mango
            base_repo: "quay.io/fedora/fedora-bootc"
            image: nelhua-mango
            description: "Nelhua Linux bootc (Mango edition)"
            keywords: "bootc,fedora,mango,nelhua"
          - name: kde
            base_repo: "quay.io/fedora/fedora-kinoite"
            image: nelhua-kde
            description: "Nelhua Linux bootc (KDE edition)"
            keywords: "bootc,fedora,kde,plasma,kinoite,nelhua"
        channel:
          - { name: stable,  base_tag: "44" }
          - { name: rawhide, base_tag: "rawhide" }

    steps:
      - name: Determine channel
        id: channel
        run: |
          # Stable channel follows the trigger-based mapping:
          #   - push to main         -> :latest
          #   - push of v* tag       -> :stable (+ :v<tag>, see metadata-action)
          #   - workflow_dispatch    -> :stable
          #   - schedule (cron)      -> :latest (catch-up)
          #   - pull_request         -> :pr-N
          # Rawhide channel always tags :rawhide regardless of trigger
          # (PRs use :rawhide-pr-N to avoid noise on shared logs).
          if [[ "${{ matrix.channel.name }}" == "rawhide" ]]; then
            case "${{ github.event_name }}" in
              pull_request) CHANNEL="rawhide-pr-${{ github.event.number }}" ;;
              *)            CHANNEL=rawhide ;;
            esac
          else
            case "${{ github.event_name }}" in
              schedule)          CHANNEL=latest ;;
              pull_request)      CHANNEL="pr-${{ github.event.number }}" ;;
              workflow_dispatch) CHANNEL=stable ;;
              push)
                if [[ "${{ github.ref_type }}" == "tag" ]]; then
                  CHANNEL=stable
                else
                  CHANNEL=latest
                fi
                ;;
              *)                 CHANNEL=latest ;;
            esac
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Prepare environment
        run: |
          REG_LC="${IMAGE_REGISTRY,,}"
          IMG_LC="${{ matrix.desktop.image }}"
          IMG_LC="${IMG_LC,,}"
          echo "IMAGE_REGISTRY=${REG_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMG_LC}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${{ matrix.desktop.base_repo }}:${{ matrix.channel.base_tag }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          tags: |
            type=raw,value=${{ steps.channel.outputs.channel }}
            type=raw,value=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            type=ref,event=tag,enable=${{ matrix.channel.name == 'stable' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.desktop.description }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.version=${{ steps.channel.outputs.channel }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.keywords=${{ matrix.desktop.keywords }}
            io.artifacthub.package.license=Apache-2.0
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_REGISTRY_PATH=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
            DESKTOP=${{ matrix.desktop.name }}

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v2.6.3'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}:${tag}"
          done
