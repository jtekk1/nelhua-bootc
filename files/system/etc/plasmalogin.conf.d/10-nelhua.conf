# Tell plasma-login-manager (Fedora Kinoite F44's SDDM replacement) to use the
# Nelhua-branded Plasma global theme by default. Until visual assets land in
# /usr/share/plasma/look-and-feel/org.nelhua.linux.default/contents/, the
# theme inherits from breeze and looks identical to default Kinoite.
#
# Override per-user via System Settings → Login Screen, or by writing
# ~/.config/plasmaloginrc.

[Theme]
Current=org.nelhua.linux.default
