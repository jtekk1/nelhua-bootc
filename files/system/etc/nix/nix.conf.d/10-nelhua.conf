# Nelhua Nix overrides (drop-in for Determinate's /etc/nix/nix.conf).
#
# - experimental-features: enable flakes + the `nix` command surface.
#   Flakes are the canonical interface going forward; channels are deprecated
#   and Nelhua does not seed any.
# - trusted-users: allow wheel members to pin substituters and use binary
#   caches without re-confirming. root is always implicitly trusted but
#   listed explicitly for clarity.
extra-experimental-features = nix-command flakes
trusted-users = root @wheel
