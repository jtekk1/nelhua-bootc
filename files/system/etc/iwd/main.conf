[General]
EnableNetworkConfiguration=true

# rtw89 (and other chipsets without off-channel scan support) treat iwd's
# periodic background scan as a hard interruption of the active association.
# Symptom: connected -> disconnected -> reconnected every ~7 minutes, with a
# fresh DHCP lease each time. Disable periodic scan to eliminate the cadence.
# See bootc/plan.md "[P1] WiFi" for diagnosis history.
[Scan]
DisablePeriodicScan=true
