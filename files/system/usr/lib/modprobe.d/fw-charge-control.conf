# Framework laptop charge control (Aurora pattern, see ublue-os/aurora →
# get-aurora-dev/common). Tells the cros_charge_control module to probe
# and bind to the Framework EC, exposing the charge-limit sysfs nodes
# Plasma's "Battery & Brightness" KCM uses. Universal-safe: on non-Framework
# hardware cros_charge_control never loads, so this option is inert.
options cros_charge_control probe_with_fwk_charge_control=1
